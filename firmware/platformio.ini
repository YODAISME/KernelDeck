; KernelDeck Firmware — PlatformIO Configuration
; Target: ESP32 Development Board with ST7789 SPI TFT Display
; Owner: B

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Compiler flags for performance and clean builds
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINOJSON_ENABLE_STD_STRING=0

; Core dependencies locked for stability
lib_deps =
    bblanchon/ArduinoJson@^7.3.0
    links2004/WebSockets@^2.4.1
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ST7789 and ST7735 Library@^1.10.3
    adafruit/Adafruit BusIO@^1.16.0
